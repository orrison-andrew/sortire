name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs on purpose. With upload + deploy in one job,
  # deploy-pages can fail with: No artifacts named "github-pages" were found.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the site folder
        run: |
          test -f webapp/index.html || { echo "webapp/index.html is missing"; exit 1; }
          ls -R webapp

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "webapp"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
