name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs on purpose. With upload + deploy in one job,
  # deploy-pages can fail with: No artifacts named "github-pages" were found.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the site folder
        run: |
          test -f webapp/index.html || { echo "webapp/index.html is missing"; exit 1; }
          ls -R webapp

      - name: Verify precache list
        shell: bash
        run: |
          cd webapp
          sed -n '/CORE_ASSETS = \[/,/\];/p' sw.js | grep -o "'\./[^']*'" | tr -d "'" | while read -r f; do
            [ "$f" = "./" ] && continue
            [ -e "$f" ] || { echo "Missing precache file: $f"; exit 1; }
          done

      - name: Stamp service worker cache version
        shell: bash
        run: |
          sed -i "s|^const CACHE_NAME = .*|const CACHE_NAME = 'sortire-${GITHUB_SHA::8}';|" webapp/sw.js
          grep -q "sortire-${GITHUB_SHA::8}" webapp/sw.js || { echo "CACHE_NAME was not stamped"; exit 1; }

      # Uncomment if you keep a codec test that matches the current code format
      # - name: Run settings codec test
      #   run: node tools/settings-codec.test.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "webapp"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
