<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sortire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Put every finger on the screen. Sortire decides who goes first.">
  <meta name="theme-color" content="#14101e">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sortire">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Web App Manifest & Favicons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="codes.css">
</head>
<body>
  <!-- GPU tabletop -->
  <div id="wood-bg" aria-hidden="true"></div>

  <canvas id="arena"></canvas>

  <!-- GPU winner effects -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <button id="tune-btn" type="button" aria-label="Settings">⚙</button>

  <div id="update-toast" class="update-toast" role="alert" aria-live="polite">
    <span id="update-msg">New version available</span>
    <button id="update-btn" type="button">Update</button>
  </div>

  <div id="tuning-panel" aria-modal="true" role="dialog">
    <div class="panel-header">
      <h2>Settings</h2>
      <div class="panel-actions">
        <button id="tune-done" class="panel-btn done" type="button">Done</button>
      </div>
    </div>
    <div id="tuning-content"></div>
  </div>

  <div id="import-modal" class="modal-backdrop">
    <div class="modal-box">
      <h3>Import Settings</h3>
      <textarea id="import-text" placeholder="Paste a settings code"></textarea>
      <div class="modal-actions">
        <button id="import-cancel" class="panel-btn" type="button">Cancel</button>
        <button id="import-submit" class="panel-btn done" type="button">Apply</button>
      </div>
    </div>
  </div>

  <!-- Shared GL helpers first, then the materials built on them -->
  <script src="gl-util.js"></script>
  <script src="disc.js"></script>
  <script src="table-layer.js"></script>
  <script src="material-set.js"></script>
  <script src="woodgrain.js"></script>
  <script src="rocktexture.js"></script>
  <script src="effects.js"></script>
  <script src="sound.js"></script>
  <script src="settings.js"></script>
  <script src="surface-mode.js"></script>
  <script src="table.js"></script>
  <script src="app.js"></script>
</body>
</html>
