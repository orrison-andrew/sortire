# Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen generate
name: Sortire
options:
  bundleIdPrefix: com.camelot.merlin
  deploymentTarget:
    iOS: "16.0"
targets:
  Sortire:
    type: application
    platform: iOS
    sources: [Sortire]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camelot.merlin.sortire
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sortire
        INFOPLIST_KEY_UILaunchScreen_Generation: YES   # blank launch screen = fastest start
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # DEVELOPMENT_TEAM: YOUR_TEAM_ID
